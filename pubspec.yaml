name: purix_academy
description: "Official App for Purix Academy"
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.0
  google_sign_in: ^6.0.0
  shared_preferences: ^2.0.0
  http: ^1.0.0
  url_launcher: ^6.0.0
  device_info_plus: ^10.1.0
  webview_flutter: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  image_path: "assets/logo.png"
  android: true
  ios: true
  min_sdk_android: 21